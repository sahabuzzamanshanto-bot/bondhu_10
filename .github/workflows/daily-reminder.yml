name: Daily Loan Reminder

on:
  schedule:
    # প্রতিদিন বাংলাদেশ সময় সন্ধ্যা ৭টায় চলবে (UTC 13:00, বাংলাদেশ = UTC+6)
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # চাইলে GitHub-এর Actions ট্যাব থেকে হাতেও চালানো যাবে (টেস্টের জন্য)

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: scripts
        run: npm install firebase-admin

      - name: Send reminders
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.BONDHU_FUND_10_SECRET }}
        run: node send-reminders.js
        
